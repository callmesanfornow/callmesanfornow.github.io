<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racist-narrative radar</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1c1f24; --muted: #565d69; --line: #d6d3ca;
  --accent: #1c1f24; --warn: #b3261e; --warn-bg: #fbe9e7; --note-bg: #f0eee8;
  --c-racist: #b3261e; --c-review: #e9aaa4; --c-counter: #2a7653; --c-news: #55657c; --c-irrelevant: #666b73; --on-seg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1d2127; --text: #e8e6e1; --muted: #a0a7b1; --line: #343a42;
    --accent: #e8e6e1; --warn: #ff8a80; --warn-bg: #3a1f1d; --note-bg: #23272e;
    --c-racist: #ff8a80; --c-review: #7a3b36; --c-counter: #6fcf9f; --c-news: #9db0c9; --c-irrelevant: #98a0aa; --on-seg: #14171b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.55 Georgia, "Iowan Old Style", "Times New Roman", serif; }
h1, h2, h3, .ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }
header { padding: 24px 0 12px; border-bottom: 2px solid var(--text); display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.9rem); letter-spacing: -0.025em; line-height: 1.08; }
.codetop { margin: 8px 0 0; font: 600 .9rem system-ui, sans-serif; }
.codetop a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
.codetop a:hover { border-color: var(--text); }
.sub { margin: 4px 0 0; color: var(--muted); font-style: italic; }
h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; margin: 36px 0 10px; }
.lang { display: inline-flex; border: 1px solid var(--text); border-radius: 6px; overflow: hidden; }
.lang button { font: 600 .9rem system-ui, sans-serif; padding: 6px 14px; background: transparent; color: var(--text); border: 0; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.lang button:focus-visible, .row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 10px 14px; margin: 16px 0 0; font-family: system-ui, sans-serif; font-size: .92rem; }
.lead { font-size: clamp(1.15rem, 2.6vw, 1.5rem); line-height: 1.4; margin: 6px 0 18px; max-width: 54ch; }
.meta { color: var(--muted); font-size: .85rem; margin-top: 8px; font-family: system-ui, sans-serif; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; }
.pending { color: var(--muted); font-style: italic; }
.error { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 12px 16px; margin-top: 20px; font-family: system-ui, sans-serif; }

/* funnel */
.fbar { margin: 0 0 22px; }
.fbar .cap { font: 600 1rem system-ui, sans-serif; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.fbar .cap .n { color: var(--muted); font-weight: 400; }
.bar { display: flex; height: 56px; width: 100%; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar.small { height: 38px; }
.bar span { display: flex; align-items: center; justify-content: center; color: var(--on-seg); font: 700 1rem system-ui, sans-serif; overflow: hidden; white-space: nowrap; min-width: 0; }
.bar .s-racist_sure { background: var(--c-racist); } .bar .s-counter_speech { background: var(--c-counter); }
.bar .s-news_reporting { background: var(--c-news); } .bar .s-irrelevant { background: var(--c-irrelevant); }
.hatch { background: repeating-linear-gradient(45deg, var(--c-racist) 0 3px, var(--c-review) 3px 7px); }
.bar .s-racist_review { background: repeating-linear-gradient(45deg, var(--c-racist) 0 3px, var(--c-review) 3px 7px); color: var(--text); }
.bar .s-racist_review b { background: var(--surface); padding: 0 5px; border-radius: 3px; font-weight: 700; }
.legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; font-family: system-ui, sans-serif; }
@media (max-width: 900px) { .legend { grid-template-columns: repeat(2, 1fr); } }
.legend .k { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.legend .k i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
.legend .v { font-size: clamp(1.25rem, 3vw, 1.8rem); font-weight: 700; line-height: 1.2; }
.legend .v small { font-size: .85rem; font-weight: 400; color: var(--muted); }
.keep { margin-top: 14px; font: 1.05rem system-ui, sans-serif; border-left: 4px solid var(--c-racist); padding: 4px 0 4px 14px; }
.keep b { font-size: 1.4rem; }
.bar-note { color: var(--muted); font: .85rem system-ui, sans-serif; margin: 8px 0 0; }

/* narratives */
.cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px 100px; gap: 14px; align-items: center; }
.cols { padding: 0 14px 6px; font: .8rem system-ui, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cols .r, .row .r { text-align: right; }
.nlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); background: var(--surface); }
.nlist > li { border-bottom: 1px solid var(--line); }
.nlist > li:last-child { border-bottom: 0; }
.row { all: unset; box-sizing: border-box; width: 100%; padding: 14px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px 100px; gap: 14px; align-items: center; font-family: system-ui, sans-serif; }
.row:hover { background: var(--note-bg); }
.row .nm { font-size: 1.2rem; font-weight: 600; line-height: 1.3; }
.row .nm small { display: block; font-weight: 400; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.row .num { font-size: 1.3rem; font-weight: 700; text-align: right; }
.row .num small { display: block; font-size: .72rem; font-weight: 400; color: var(--muted); }
.row .num.few { font-size: .8rem; font-weight: 400; color: var(--muted); line-height: 1.3; }
.row[aria-expanded="true"] { background: var(--note-bg); box-shadow: inset 4px 0 0 var(--accent); }
.badge.amp { background: var(--accent); }
.up { color: var(--c-racist); }
svg.spark { width: 150px; height: 36px; display: block; }
.badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px; font: 700 .72rem system-ui, sans-serif; background: var(--warn); color: var(--bg); vertical-align: middle; white-space: nowrap; }
@media (max-width: 720px) {
  .cols { display: none; }
  .row { grid-template-columns: 1fr 1fr 1fr; }
  .row .nmc { grid-column: 1 / -1; }
  .row svg.spark { width: 100%; }
  .row .num { text-align: left; }
}
.detail { padding: 6px 16px 18px; }
.detail p.desc { margin: 4px 0 10px; color: var(--muted); }
.detail h3 { font-size: .95rem; text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 6px; }
.keyl { display: flex; gap: 14px; flex-wrap: wrap; font: .82rem system-ui, sans-serif; margin: 6px 0 4px; }
.keyl i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font: 11px system-ui, sans-serif; }
svg.chart .axis { stroke: var(--line); }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.card { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; font-size: .95rem; display: flex; flex-direction: column; gap: 8px; }
.card .tag { font: .78rem system-ui, sans-serif; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card .lab { background: var(--c-racist); color: var(--on-seg); border-radius: 3px; padding: 1px 7px; font-weight: 700; }
.card .ts { font-weight: 700; color: var(--text); }
.card .q { margin: 0; }
.card mark { background: var(--warn-bg); color: var(--text); padding: 0 2px; border-bottom: 2px solid var(--warn); }
.card .vlink { font: 600 .85rem system-ui, sans-serif; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); align-self: flex-start; padding-bottom: 1px; }
.card .vlink:hover { border-color: var(--text); }
.card .why { font: .85rem system-ui, sans-serif; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.clusters { font: .9rem system-ui, sans-serif; margin: 4px 0 0; padding-left: 18px; }

/* method */
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; grid-template-columns: repeat(5, 1fr); font-family: system-ui, sans-serif; }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; border: 1px solid var(--line); background: var(--note-bg); padding: 10px 12px; font-size: .92rem; }
.steps li::before { content: counter(s); display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--accent); color: var(--bg); font-weight: 700; margin-right: 8px; font-size: .8rem; }
.eval { display: flex; gap: 32px; flex-wrap: wrap; margin: 6px 0; }
.eval .big { font: 700 2.2rem system-ui, sans-serif; line-height: 1.1; }
.eval .lab { font: .85rem system-ui, sans-serif; color: var(--muted); max-width: 26ch; }
.eval .big.second { font-size: 1.5rem; color: var(--muted); }
.evtext { font: .9rem system-ui, sans-serif; color: var(--muted); margin: 8px 0; }
.hc { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); font: .95rem system-ui, sans-serif; }
.hc small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.define { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-family: system-ui, sans-serif; font-size: .92rem; }
.define h3 { margin: 0 0 4px; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .twocol { grid-template-columns: 1fr; } }
.panel ul { padding-left: 20px; margin: 6px 0; }
.panel h3 { margin: 0 0 6px; font-size: 1rem; }
details { margin-top: 8px; font: .85rem system-ui, sans-serif; color: var(--muted); }
details.ctx { font: inherit; color: var(--text); margin-top: 10px; }
details.ctx > summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
details.ctx .cards { margin-top: 8px; }
footer { margin-top: 36px; color: var(--muted); font: .82rem system-ui, sans-serif; }
footer p { margin: 4px 0; }

/* ---- 7 Nov: the brief (front page) ---- */
.brief { margin: 18px 0 6px; padding: 4px 0 4px; }
.brief .kicker { font: 700 .8rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .14em; color: var(--c-racist); margin: 0; }
.brief .brief-sub { margin: 6px 0 16px; color: var(--muted); font-style: italic; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.findings li { padding: 16px 18px 18px 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.findings li + li { padding-left: 18px; border-left: 1px solid var(--line); }
.findings .stat { white-space: nowrap; font: 800 clamp(1.7rem, 3.2vw, 2.15rem)/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.findings li:first-child .stat { color: var(--c-racist); }
.findings .ftext { font-size: 1rem; line-height: 1.45; }
.findings .go { margin-top: auto; font: 600 .85rem system-ui, sans-serif; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); align-self: flex-start; padding-bottom: 2px; transition: border-color .15s ease, transform .15s ease; }
.findings .go:hover { border-color: var(--text); transform: translateX(3px); }
.brief .rising { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font: .95rem system-ui, sans-serif; }
.brief .brief-foot { margin: 6px 0 0; color: var(--muted); font: .82rem system-ui, sans-serif; }
@media (max-width: 1100px) {
  .findings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .findings li:nth-child(3) { padding-left: 0; border-left: 0; }
  .findings li:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .findings { grid-template-columns: 1fr; }
  .findings li, .findings li + li { padding-left: 0; border-left: 0; }
  .findings li + li { border-top: 1px solid var(--line); }
}
/* ---- 7 Nov: micro-interactions ---- */
html { scroll-behavior: smooth; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.row { transition: background-color .15s ease; }
.row[aria-expanded="true"] { box-shadow: none; }
.row .nm::before { content: "\25B8"; display: inline-block; width: 1.1em; color: var(--muted); transition: transform .18s ease, color .18s ease; }
.row[aria-expanded="true"] .nm::before { transform: rotate(90deg); color: var(--c-racist); }
.detail:not([hidden]) { animation: rise .2s ease-out both; }
@keyframes rise { from { transform: translateY(-6px); } to { transform: none; } }
details.ctx > summary { list-style: none; transition: color .15s ease; }
details.ctx > summary::-webkit-details-marker { display: none; }
details.ctx > summary::before { content: "\25B8"; display: inline-block; width: 1.1em; transition: transform .18s ease; }
details.ctx[open] > summary::before { transform: rotate(90deg); }
details.ctx > summary:hover { color: var(--c-racist); }
.lang button { transition: background-color .15s ease, color .15s ease, transform .1s ease; }
.lang button:active { transform: scale(.96); }
.card { transition: border-color .15s ease; }
.card:hover { border-color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="subtitle"></p>
      <p class="sub" id="positioning" style="font-style:normal;color:var(--text);margin-top:8px;max-width:60ch"></p>
      <p class="codetop"><a href="https://github.com/callmesanfornow/racist-narrative-radar" target="_blank" rel="noopener" data-i18n="code_top"></a></p>
    </div>
    <div class="lang" role="group" aria-label="Language / Langue">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
    </div>
  </header>

  <div id="synthetic" class="banner" hidden></div>
  <div id="error" class="error" role="alert" hidden></div>

  <main id="main" hidden>
    <section id="brief" class="brief" aria-labelledby="h-brief" hidden></section>

    <section aria-labelledby="h-funnel">
      <h2 id="h-funnel" data-i18n="funnel_h"></h2>
      <div id="funnel" class="panel"></div>
    </section>

    <section aria-labelledby="h-narr">
      <h2 id="h-narr" data-i18n="narr_h"></h2>
      <p class="meta" data-i18n="narr_sub" style="margin:-4px 0 10px"></p>
      <div class="cols" aria-hidden="true">
        <div data-i18n="col_narr"></div><div data-i18n="col_trend"></div><div class="r" data-i18n="col_change"></div><div class="r" data-i18n="col_reach"></div>
      </div>
      <ul id="nlist" class="nlist"></ul>
    </section>

    <section aria-labelledby="h-method">
      <h2 id="h-method" data-i18n="method_h"></h2>
      <div class="panel">
        <h3 data-i18n="pipeline_h"></h3>
        <ol class="steps" id="steps"></ol>
        <div class="define">
          <h3 data-i18n="define_h"></h3>
          <p data-i18n="define_p" style="margin:0"></p>
          <p class="meta" data-i18n="off_explain" style="margin:8px 0 0"></p>
          <p class="meta" data-i18n="amp_explain" style="margin:2px 0 0"></p>
        </div>
        <div class="twocol" style="margin-top:16px">
          <div>
            <h3 data-i18n="eval_h"></h3>
            <div id="eval"></div>
          </div>
          <div>
            <h3 data-i18n="limits_h"></h3>
            <ul id="limits"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="meta" class="meta"></div>
  <footer>
    <p id="credits"></p>
    <p data-i18n="footer"></p>
    <p><a href="https://github.com/callmesanfornow/racist-narrative-radar" target="_blank" rel="noopener" data-i18n="code_link"></a></p>
  </footer>
</div>

    var key = el("div", { "class": "keyl" });
    ["racist", "counter_speech", "news_reporting"].forEach(function (l) {
      key.appendChild(el("span", {}, [el("i", { style: "background:var(" + COLOURS[l] + ")" }), document.createTextNode(t("l_" + l))]));
    });
    box.appendChild(key);
    if (n.weekly.length) box.appendChild(chartSvg(n.weekly));
    else box.appendChild(el("p", { "class": "pending", text: t("no_week") }));
    box.appendChild(el("h3", { text: t("ev_h") }));
    var cards = el("div", { "class": "cards" });
    if (!n.examples.length) cards.appendChild(el("p", { "class": "pending", text: t("no_ex") }));
    n.examples.forEach(function (ex) { cards.appendChild(card(ex)); });
    box.appendChild(cards);
    var ctx = n.context_examples || {}, ctxLabels = ["counter_speech", "news_reporting"].filter(function (l) { return (ctx[l] || []).length; });
    if (ctxLabels.length) box.appendChild(el("h3", { text: t("ctx_h") }));
    ctxLabels.forEach(function (l) {
      var total = (n.totals && n.totals[l]) || ctx[l].length;
      var det = el("details", { "class": "ctx" }, [el("summary", { text: tn("ctx_sum", total, { l: t("l_" + l), n: num(total) }) })]);
      var cc = el("div", { "class": "cards" });
      ctx[l].forEach(function (ex) { cc.appendChild(card(ex)); });
      det.appendChild(cc);
      box.appendChild(det);
    });
  }

  /* ---------- method ---------- */
  function renderMethod() {
    var steps = document.getElementById("steps");
    clear(steps);
    t("steps").forEach(function (s) { steps.appendChild(el("li", { text: s })); });
    var lim = document.getElementById("limits");
    clear(lim);
    var lims = t("limits").slice();
    if (linksOn()) lims[1] = t("limits_links", { t: linksTime() });
    lims.forEach(function (s) { lim.appendChild(el("li", { text: s })); });
    var box = document.getElementById("eval");
    clear(box);
    var ev = data.eval;
    if (!ev || (ev.fpr == null && ev.precision == null)) {
      box.appendChild(el("p", { "class": "pending", text: t("eval_soon") }));
      return;
    }
    var row = el("div", { "class": "eval" });
    var x100 = function (v) { return t("in100", { x: num(v * 100, 1) }); };
    if (ev.fpr_sure != null) {
      row.appendChild(el("div", {}, [el("div", { "class": "big", text: x100(ev.fpr_sure) }), el("div", { "class": "lab", text: t("fa_sure") })]));
      if (ev.fpr != null) row.appendChild(el("div", {}, [el("div", { "class": "lab", style: "font-size:1rem;max-width:none;align-self:flex-end", text: t("fa_all", { x: num(ev.fpr * 100, 1) }) })]));
    } else if (ev.fpr != null) {
      row.appendChild(el("div", {}, [el("div", { "class": "big", text: x100(ev.fpr) }), el("div", { "class": "lab", text: t("fa_all", { x: num(ev.fpr * 100, 1) }) })]));
    }
    [["precision", "eval_prec", ev.n_precision, "eval_n_prec"], ["recall", "eval_rec", ev.n_precision, "eval_n_prec"]].forEach(function (k) {
      if (ev[k[0]] == null) return;
      var lab = t(k[1]) + (k[2] != null ? " — " + t(k[3], { n: num(k[2]) }) : "");
      row.appendChild(el("div", {}, [el("div", { "class": "big", text: pct(ev[k[0]] * 100) }), el("div", { "class": "lab", text: lab })]));
    });
    box.appendChild(row);
    if (ev.fpr != null || ev.fpr_sure != null) {
      box.appendChild(el("p", { "class": "evtext", text: ev.n_benign != null ? t("eval_tested", { n: num(ev.n_benign) }) : t("eval_tested_nn") }));
    }
    renderHandcheck(box);
    if (ev.note) {
      var det = el("details", {}, [el("summary", { text: t("eval_note") }), el("p", { text: ev.note })]);
      box.appendChild(det);
    }
  }
  function renderHandcheck(box) {
    var hc = data.handcheck;
    var wrap = el("div", { "class": "hc" });
    if (!hc || hc.radar_precision == null || !hc.n_radar) {
      wrap.appendChild(el("p", { "class": "pending", text: t("hc_pending"), style: "margin:0" }));
      box.appendChild(wrap);
      return;
    }
    var yes = function (p, n) { return num(Math.round(p * n)); };
    var lo = function (ci) { return pct(ci[0] * 100, 0).replace(/ ?%$/, ""); };
    var hi = function (ci) { return pct(ci[1] * 100, 0); };
    var vars = { y: yes(hc.radar_precision, hc.n_radar), n: num(hc.n_radar) };
    var haveK = hc.keyword_precision != null && hc.n_keyword;
    if (haveK) { vars.ky = yes(hc.keyword_precision, hc.n_keyword); vars.kn = num(hc.n_keyword); }
    var main = el("div", { text: t(haveK ? "hc_main" : "hc_main_nk", vars) });
    var ciTxt = "";
    if (hc.radar_ci) ciTxt = t("hc_ci", { lo: lo(hc.radar_ci), hi: hi(hc.radar_ci) });
    if (hc.radar_ci && haveK && hc.keyword_ci) ciTxt += t("hc_ci_k", { lo: lo(hc.keyword_ci), hi: hi(hc.keyword_ci) });
    if (ciTxt) main.appendChild(el("small", { text: ciTxt }));
    wrap.appendChild(main);
    if (hc.review_racist_share != null && hc.n_review) wrap.appendChild(el("small", { text: t("hc_review", { p: pct(hc.review_racist_share * 100, 0), n: num(hc.n_review) }) }));
    if (hc.storyline_accuracy != null && hc.n_storyline) wrap.appendChild(el("small", { text: t("hc_story", { p: pct(hc.storyline_accuracy * 100, 0), n: num(hc.n_storyline) }) }));
    box.appendChild(wrap);
  }

  function weeksCovered() {
    if (data.weeks && data.weeks.n != null) return data.weeks.n;
    return data.narratives.reduce(function (m, n) { return Math.max(m, n.weekly.length); }, 0);
  }
  function renderMeta() {
    document.getElementById("positioning").textContent = t("positioning", { n: num((data.totals || {}).total || 0), w: num(weeksCovered()) });
    var syn = document.getElementById("synthetic");
    syn.hidden = !data.synthetic;
    richInto(syn, t("synthetic"));
    var tt = data.totals || {};
    var parts = [t("meta_gen", { d: (data.generated_at || "?").replace("T", " ").slice(0, 16) }),
      t("meta_model", { m: data.model || "?", p: data.prompt_version || "?" }),
      t("meta_items", { t: num(tt.total || 0), r: num(tt.racist || 0), s: num(tt.racist_sure != null ? tt.racist_sure : (tt.racist || 0)) })];
    if (data.weeks && data.weeks.left_out) parts.push(t("weeks_left", { k: data.weeks.left_out }));
    if (data.undated) parts.push(t("meta_undated", { u: data.undated }));
    document.getElementById("meta").textContent = parts.join(" · ");
  }

  function renderStatic() {
    document.documentElement.lang = lang;
    document.title = t("page_title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (e) {
      var v = t(e.getAttribute("data-i18n"));
      if (typeof v === "string") e.textContent = v;
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    document.getElementById("credits").textContent = t("credits");
  }
  /* ---------- brief (7 Nov) ---------- */
  function renderBrief() {
    var box = document.getElementById("brief");
    clear(box);
    var b = data.brief && data.brief[lang];
    if (!b || !b.findings || !b.findings.length) { box.hidden = true; return; }
    box.hidden = false;
    box.appendChild(el("p", { "class": "kicker", id: "h-brief", text: b.title + " · " + b.date }));
    box.appendChild(el("p", { "class": "brief-sub", text: b.subtitle }));
    var ol = el("ol", { "class": "findings" });
    b.findings.forEach(function (f) {
      var li = el("li", {}, [el("span", { "class": "stat", text: f.stat }), el("span", { "class": "ftext", text: f.text })]);
      if (f.narrative_id) {
        var a = el("a", { href: "#" + f.narrative_id, "class": "go", text: b.cta + " →" });
        a.addEventListener("click", function () { setTimeout(openFromHash, 0); });
        li.appendChild(a);
      }
      ol.appendChild(li);
    });
    box.appendChild(ol);
    box.appendChild(el("p", { "class": "rising", text: b.rising }));
    box.appendChild(el("p", { "class": "brief-foot", text: b.footer }));
  }
  function openFromHash() {
    if (!data) return;
    var id = decodeURIComponent((location.hash || "").slice(1));
    if (!data.narratives.some(function (n) { return n.narrative_id === id; })) return;
    selected = id;
    renderNarratives();
    var row = document.getElementById("n-" + id);
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (row) row.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }
  window.addEventListener("hashchange", openFromHash);
  function render() {
    renderStatic();
    if (!data) return;
    if (linksOn()) { var fe = document.querySelector('[data-i18n="footer"]'); if (fe) fe.textContent = t("footer_links"); }
    renderMeta(); renderBrief(); renderFunnel(); renderNarratives(); renderMethod();
  }

  function initLang() {
    var q = null, stored = null;
    try { q = new URLSearchParams(location.search).get("lang"); } catch (e) { /* ignore */ }
    try { stored = localStorage.getItem("htf-lang"); } catch (e) { /* storage unavailable */ }
    lang = [q, stored].filter(function (x) { return x === "fr" || x === "en"; })[0] || "en";
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("htf-lang", lang); } catch (e) { /* ignore */ }
      render();
    });
  });

  initLang();
  renderStatic();
  fetch("data.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !Array.isArray(d.narratives)) throw new Error("format");
      data = d;
      if (!data.narratives.length) { var er = document.getElementById("error"); er.textContent = t("empty"); er.hidden = false; renderMeta(); return; }
      selected = data.narratives[0].narrative_id;
      document.getElementById("main").hidden = false;
      render();
      if (location.hash) openFromHash();
    })
    .catch(function (e) {
      var box = document.getElementById("error");
      box.textContent = t("load_err", { e: e.message });
      box.hidden = false;
    });
})();
</script>
</body>
</html>
